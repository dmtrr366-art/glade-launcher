<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glade Launcher — Друзья и чаты</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/titlebar.css">
<link rel="stylesheet" href="css/friends.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="win" data-v="friends" data-page="friends">

  <aside class="side">
    <div class="logo">
      <img src="assets/glade-logo.png" alt="Glade" class="logo-img">
      <b>GLADE</b>
    </div>
    <nav class="nav" id="nav">
      <a href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>Главная</a>
      <a href="mods.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></svg>Моды</a>
      <a href="friends.html" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Друзья<span class="nav-badge" id="friendsBadge" style="display:none">0</span></a>
      <a href="appearance.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.49 2 2 6.49 2 12c0 4.41 3.59 8 8 8h1.25c.96 0 1.75-.78 1.75-1.75 0-.46-.18-.88-.47-1.19-.29-.31-.48-.73-.48-1.19 0-.96.79-1.75 1.75-1.75H16c3.31 0 6-2.69 6-6 0-5.51-4.49-10-10-10z"/></svg>Оформление</a>
      <a href="settings.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 2h4l1 3 3-1 2 3-2 2 1 3 3 1v4l-3 1-1 3 2 2-2 3-3-1-1 3h-4l-1-3-3 1-2-3 2-2-1-3-3-1v-4l3-1 1-3-2-2 2-3 3 1z" transform="scale(.82) translate(2.6 2.6)"/><circle cx="12" cy="12" r="3.2"/></svg>Настройки</a>
    </nav>
    <svg class="swoosh" viewBox="0 0 260 300" fill="none"><path d="M10 300C10 180 120 130 250 0" stroke="#ff6a00" stroke-width="3" opacity=".8"/><path d="M10 300C10 200 110 160 250 40V300z" fill="url(#g)" opacity=".18"/><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ff6a00"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></linearGradient></defs></svg>
    <div class="user">
      <div class="av"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.500 8 7"/></svg></div>
      <div class="u-info" onclick="location.href='profile.html'">
        <span id="uname">Игрок</span>
        <small><i class="dot on-dot"></i> Онлайн</small>
      </div>
      <button id="logoutBtn" class="logout-btn" title="Выйти из аккаунта">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <section class="view" id="v-friends">
    <header class="vhead">
      <div>
        <h2>Друзья</h2>
        <p id="fSubtitle">Список друзей, заявки и личные сообщения</p>
      </div>
    </header>

    <div class="friends-layout">
      <!-- Левая колонка: поиск/добавление, фильтры и список друзей -->
      <aside class="friends-sidebar">
        <form class="friends-add-box" id="addFriendForm" onsubmit="return false;">
          <input type="text" id="addFriendInput" class="friends-add-input" placeholder="Никнейм игрока..." maxlength="24" autocomplete="off">
          <button type="submit" id="addFriendBtn" class="friends-add-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Добавить
          </button>
        </form>

        <div class="friends-tabs" id="friendsTabs">
          <button type="button" class="f-tab-btn on" data-tab="all">Все <span class="f-tab-badge" id="tabCountAll">0</span></button>
          <button type="button" class="f-tab-btn" data-tab="online">В сети <span class="f-tab-badge" id="tabCountOnline">0</span></button>
          <button type="button" class="f-tab-btn" data-tab="requests">Заявки <span class="f-tab-badge" id="tabCountRequests" style="display:none">0</span></button>
        </div>

        <div class="friends-list" id="friendsListContainer">
          <div class="friends-empty">Загрузка списка друзей...</div>
        </div>
      </aside>

      <!-- Правая колонка: диалог и переписка -->
      <main class="chat-window">
        <!-- Заглушка, когда чат не выбран -->
        <div class="chat-placeholder" id="chatPlaceholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <h3>Выберите диалог</h3>
          <p>Выберите друга из списка слева или добавьте игрока по нику, чтобы начать общение в реальном времени.</p>
        </div>

        <!-- Активное окно чата -->
        <div class="chat-active" id="chatActiveArea" style="display: none; flex-direction: column; height: 100%; flex: 1;">
          <header class="chat-header">
            <div class="chat-header-user">
              <div class="friend-avatar-wrap">
                <img id="chatHeaderAvatar" class="friend-avatar" src="assets/skins/default.png" alt="Avatar">
                <span id="chatHeaderStatusDot" class="friend-status-dot offline"></span>
              </div>
              <div>
                <div class="chat-header-name" id="chatHeaderName">Игрок</div>
                <div class="chat-header-status" id="chatHeaderStatus">Офлайн</div>
              </div>
            </div>
            <button type="button" class="chat-delete-friend-btn" id="chatDeleteFriendBtn" title="Удалить из друзей">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              Удалить из друзей
            </button>
          </header>

          <div class="chat-messages" id="chatMessages">
            <!-- Сообщения будут отрендерены через JS -->
          </div>

          <form class="chat-input-bar" id="chatForm" onsubmit="return false;">
            <input type="text" class="chat-input" id="chatInput" placeholder="Напишите сообщение... (Enter для отправки)" maxlength="500" autocomplete="off">
            <button type="submit" class="chat-send-btn" id="chatSendBtn" title="Отправить сообщение">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </form>
        </div>
      </main>
    </div>

  </section>

</div>
<div class="toast" id="toast" role="status"></div>

<script src="js/auth.js"></script>
<script src="js/titlebar.js"></script>
<script src="js/app.js"></script>
<script src="js/friends.js"></script>
</body>
</html>
