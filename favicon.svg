<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Градиент фона (темный обсидиан) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c120c" />
      <stop offset="50%" stop-color="#0e0a08" />
      <stop offset="100%" stop-color="#050403" />
    </linearGradient>

    <!-- Огненный оранжевый градиент HopliteX -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9933" />
      <stop offset="45%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#c93800" />
    </linearGradient>

    <!-- Свечение кристаллического ядра -->
    <linearGradient id="coreGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffb366" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <!-- Металлический ободок -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a1f" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4a2612" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff5a00" stop-opacity="0.6" />
    </linearGradient>

    <!-- Фильтр неонового свечения -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Закругленная форма иконки приложения (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Внутреннее радиальное свечение -->
  <circle cx="32" cy="32" r="22" fill="#ff6a00" opacity="0.12" />

  <!-- Эмблема Короны-Шлема HopliteX -->
  <g filter="url(#glow)">
    <!-- Теневая база / задний контур -->
    <path d="M7 21 L19 33 L32 11 L45 33 L57 21 L51 46 L13 46 Z" fill="#802000" />

    <!-- Главная корона воина -->
    <path d="M8 22 L20 34 L32 12 L44 34 L56 22 L50 45 L14 45 Z" fill="url(#fireGrad)" />

    <!-- Центральный граненый кристалл / буква H -->
    <polygon points="32,15 37,28 32,41 27,28" fill="url(#coreGrad)" opacity="0.95" />
    
    <!-- Боковые полигональные грани для объемного 3D-эффекта -->
    <polygon points="20,34 27,28 32,41 20,44" fill="#d94400" opacity="0.8" />
    <polygon points="44,34 37,28 32,41 44,44" fill="#ff7d1a" opacity="0.85" />
    <polygon points="8,22 14,35 20,34" fill="#ffaa33" opacity="0.75" />
    <polygon points="56,22 50,35 44,34" fill="#a82800" opacity="0.75" />

    <!-- Нижняя база короны / платформа -->
    <rect x="14" y="47" width="36" height="4.5" rx="2" fill="url(#fireGrad)" />
    <rect x="18" y="48.2" width="28" height="2" rx="1" fill="#ffb870" opacity="0.8" />
  </g>
</svg>
